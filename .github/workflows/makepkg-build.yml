name: Build AUR Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "AUR package name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            sudo \
            github-cli

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone AUR package
        run: |
          su builder -c "
            git clone https://aur.archlinux.org/${{ inputs.package }}.git
          "

      - name: Build package
        run: |
          su builder -c "
            cd ${{ inputs.package }}
            makepkg -s --noconfirm
          "

      - name: Collect packages
        run: |
          mkdir /packages
          find /home/builder/${{ inputs.package }} \
            -type f \
            \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' \) \
            -exec cp {} /packages/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: /packages/*

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.package }}"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" \
            --title "${{ inputs.package }}" \
            --notes "Automated build of ${{ inputs.package }}"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ inputs.package }}" \
            /packages/* \
            --clobber
