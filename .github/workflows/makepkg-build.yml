name: Build AUR Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "AUR package name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: System setup
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo github-cli

      - name: Create builder user + workspace
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/build
          chown -R builder:builder /home/builder

      - name: Clone AUR package
        run: |
          runuser -u builder -- bash -lc "
            cd /home/builder/build &&
            git clone https://aur.archlinux.org/${{ inputs.package }}.git
          "

      - name: Build package
        run: |
          runuser -u builder -- bash -lc "
            cd /home/builder/build/${{ inputs.package }} &&
            makepkg -s --noconfirm --noprogressbar
          "

      - name: Collect .zst packages
        run: |
          mkdir -p /packages
          cp /home/builder/build/${{ inputs.package }}/*.pkg.tar.zst /packages/ || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: /packages/*

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.package }}"

          gh release delete "$TAG" -y || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automated AUR build for $TAG"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.package }}" /packages/* --clobber
